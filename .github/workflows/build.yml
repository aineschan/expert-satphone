concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}
env:
  BUILD_CONFIG: 'Release'
  IOS_CMAKE_REF: '21598aa550701d20654c032328f7e8710a14099b'
jobs:
  xcode:
    name: 'Build iPad 4 / iOS 10.3.4 (armv7)'
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: macos-15
    env:
      IOS_ARCHS: 'armv7'
      DEPLOYMENT_TARGET: '10.3'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Toolchain versions and legacy architecture check'
        run: |
          xcodebuild -version
          sw_vers
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDKROOT"
          xcrun --sdk iphoneos clang -arch armv7 -miphoneos-version-min=10.3 -fsyntax-only -x c /dev/null
      - name: 'Fetch ios-cmake toolchain'
        run: |
          git clone --revision="$IOS_CMAKE_REF" https://github.com/leetal/ios-cmake.git .ios-cmake
      - name: 'Configure'
        env:
          RESOURCES_DIR: ${{ vars.RESOURCES_DIR }}
        run: |
          CMAKE_ARGS=(
            -B build
            -G Xcode
            -DCMAKE_BUILD_TYPE="$BUILD_CONFIG"
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/.ios-cmake/ios.toolchain.cmake"
            -DDEPLOYMENT_TARGET="$DEPLOYMENT_TARGET"
            -DENABLE_BITCODE=NO
            -DIOS_ARCHS="$IOS_ARCHS"
            -DPLATFORM=OS
            -DARCHS="$IOS_ARCHS"
            -DAPP_VERSION=3.9.12
            -DAPP_BUILD=3.9.12
            -DENABLE_PATCHES=ON
            -DJBDBG=ON
          )
          [ -n "$RESOURCES_DIR" ] && CMAKE_ARGS+=( -DRESOURCES_DIR="$RESOURCES_DIR" )
          cmake "${CMAKE_ARGS[@]}"
      - name: 'Build'
        run: |
          cmake --build build --config "$BUILD_CONFIG" -- \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: 'Verify architecture and package IPA'
        run: |
          APP="$(find build -type d -name 'Jubeat.app' -print -quit)"
          test -n "$APP" || { echo "Jubeat.app not found under build/"; exit 1; }
          BIN="$APP/Jubeat"
          lipo -info "$BIN"
          lipo -verify_arch armv7 "$BIN"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --verbose=2 "$APP"
          rm -rf Payload Jubeat-3.9.12-armv7-adhoc.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Jubeat-3.9.12-armv7-adhoc.ipa Payload
      - name: 'Upload .ipa'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          name: 'jubeat-plus-unofficial-3.9.12-armv7-ipa'
          path: 'Jubeat-3.9.12-armv7-adhoc.ipa'
          if-no-files-found: 'error'
name: 'build'
'on':
  workflow_dispatch:
  push:
    branches: ['master', 'ios1034-offline-editorid-fallback']
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ['master']
permissions: {}
